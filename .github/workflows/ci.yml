name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: darwin_test
          POSTGRES_USER: darwin_test
          POSTGRES_PASSWORD: darwin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darwin_test -d darwin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DARWIN_PG_HOST: localhost
      DARWIN_PG_PORT: "5432"
      DARWIN_PG_DB: darwin_test
      DARWIN_PG_USER: darwin_test
      DARWIN_PG_PASSWORD: darwin_test
      # CI never depends on live HERMES credentials — contract tests use
      # fixtures, and no job in this workflow reaches real HERMES.
      DARWIN_HERMES_HOST: unused-in-ci
      DARWIN_HERMES_PORT: "3307"
      DARWIN_HERMES_DB: unused
      DARWIN_HERMES_USER: unused
      DARWIN_HERMES_PASSWORD: unused
      DARWIN_BUILD_VERSION: ci
      DARWIN_BUILD_COMMIT: ${{ github.sha }}
      DARWIN_TEST_PG_DSN: "postgresql://darwin_test:darwin_test@localhost:5432/darwin_test"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev dependencies
        run: pip install -e '.[dev]'

      - name: Ruff (lint)
        run: pip install ruff && ruff check darwin tests

      - name: Unit tests
        run: pytest tests/unit -v

      - name: Contract tests
        run: pytest tests/contract -v

      - name: Apply migrations against empty DB (proof)
        run: darwin migrate

      - name: Integration tests (disposable PostgreSQL)
        run: pytest tests/integration -v -m integration

      - name: Build container image
        run: docker build -t darwin_core:ci --build-arg DARWIN_BUILD_COMMIT=${{ github.sha }} .
