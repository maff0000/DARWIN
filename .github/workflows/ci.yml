name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: darwin_test
          POSTGRES_USER: darwin_test
          POSTGRES_PASSWORD: darwin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darwin_test -d darwin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DARWIN_PG_HOST: localhost
      DARWIN_PG_PORT: "5432"
      DARWIN_PG_DB: darwin_test
      DARWIN_PG_USER: darwin_test
      DARWIN_PG_PASSWORD: darwin_test
      # CI never depends on live HERMES credentials — contract tests use
      # fixtures, and no job in this workflow reaches real HERMES.
      DARWIN_HERMES_HOST: unused-in-ci
      DARWIN_HERMES_PORT: "3307"
      DARWIN_HERMES_DB: unused
      DARWIN_HERMES_USER: unused
      DARWIN_HERMES_PASSWORD: unused
      DARWIN_BUILD_VERSION: ci
      DARWIN_BUILD_COMMIT: ${{ github.sha }}
      DARWIN_TEST_PG_DSN: "postgresql://darwin_test:darwin_test@localhost:5432/darwin_test"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev dependencies
        run: pip install -e '.[dev]'

      - name: Ruff (lint)
        run: pip install ruff && ruff check darwin tests

      - name: Unit tests
        run: pytest tests/unit -v

      - name: Contract tests
        run: pytest tests/contract -v

      - name: Apply migrations against empty DB (proof)
        run: darwin migrate

      - name: Integration tests (disposable PostgreSQL)
        run: pytest tests/integration -v -m integration

      - name: Build container image (includes the ARENA frontend build stage)
        run: docker build -t darwin_core:ci --build-arg DARWIN_BUILD_COMMIT=${{ github.sha }} .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Production build
        run: npm run build

  e2e:
    needs: [lint-and-tests, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build DARWIN_core image (real ARENA bundle inside)
        run: docker build -t darwin_core:e2e --build-arg DARWIN_BUILD_COMMIT=${{ github.sha }} .

      - name: Start disposable network + PostgreSQL
        run: |
          docker network create darwin_e2e_net
          docker run -d --name darwin_e2e_pg --network darwin_e2e_net \
            -e POSTGRES_DB=darwin -e POSTGRES_USER=darwin_app -e POSTGRES_PASSWORD=e2e_ci_pw \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec darwin_e2e_pg pg_isready -U darwin_app -d darwin && break
            sleep 1
          done

      - name: Install package (for migrate CLI + fixture seed script)
        run: pip install -e .

      - name: Apply migrations and seed real fixture data
        # Docker does NOT forward this step's env: block into a nested
        # `docker run` container automatically -- only vars explicitly
        # passed with -e (or --env-file) reach it. Build a real env file
        # from the exact values the migrate CLI / seed script need, rather
        # than relying on ambient inheritance (the bug a live CI run caught:
        # `darwin migrate` failed with "Required configuration missing:
        # DARWIN_PG_DB" because only DARWIN_PG_HOST was ever passed through).
        run: |
          cat > /tmp/darwin_e2e.env <<EOF
          DARWIN_PG_HOST=darwin_e2e_pg
          DARWIN_PG_PORT=5432
          DARWIN_PG_DB=darwin
          DARWIN_PG_USER=darwin_app
          DARWIN_PG_PASSWORD=e2e_ci_pw
          DARWIN_HERMES_HOST=unused
          DARWIN_HERMES_PORT=3307
          DARWIN_HERMES_DB=unused
          DARWIN_HERMES_USER=unused
          DARWIN_HERMES_PASSWORD=unused
          DARWIN_BUILD_VERSION=e2e
          DARWIN_BUILD_COMMIT=${{ github.sha }}
          DARWIN_BUILD_TIME=ci
          DARWIN_ENV=e2e
          EOF
          docker run --rm --env-file /tmp/darwin_e2e.env --network darwin_e2e_net \
            -v ${{ github.workspace }}:/work -w /work \
            python:3.12-slim bash -c "pip install -q -e . && darwin migrate && python frontend/e2e/fixtures/seed.py"

      - name: Export PID-004B Workshop fixture ids for the E2E run
        # seed.py's own .seed_output.json (written alongside its stdout —
        # see the script's own comment) is the only reliable place to read
        # these freshly-generated UUIDs from; this step's stdout would
        # otherwise be mixed with pip/darwin-migrate log noise.
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_ENV"
          import json
          d = json.load(open("frontend/e2e/fixtures/.seed_output.json"))["workshop_fixture_ids"]
          print(f"DARWIN_E2E_WORKSHOP_SCOUT_DISCOVERY_ID={d['scout_flow_discovery_id']}")
          print(f"DARWIN_E2E_WORKSHOP_COMPLETE_ID={d['complete_workshop_id']}")
          print(f"DARWIN_E2E_WORKSHOP_DATA_BLOCKED_ID={d['data_blocked_workshop_id']}")
          print(f"DARWIN_E2E_WORKSHOP_STALE_EDIT_ID={d['stale_edit_workshop_id']}")
          print(f"DARWIN_E2E_WORKSHOP_MENDEL_ID={d['mendel_workshop_id']}")
          PYEOF

      - name: Start DARWIN_core against the seeded database (HERMES + Trader.dev deliberately unreachable — proves degraded-but-ready)
        # --add-host pins mcp-api.trader.dev (darwin/scout/trader_dev_adapter.py
        # ALLOWED_API_HOST) to an address nothing listens on inside this
        # container, so PID-003 SCOUT's "Trader.dev unreachable" state is
        # exercised deterministically in CI — same discipline this step
        # already uses for HERMES — rather than depending on a real,
        # non-deterministic external network call.
        run: |
          docker run -d --name darwin_e2e_core --network darwin_e2e_net -p 8000:8000 \
            --add-host mcp-api.trader.dev:127.0.0.1 \
            -e DARWIN_PG_HOST=darwin_e2e_pg -e DARWIN_PG_PORT=5432 -e DARWIN_PG_DB=darwin -e DARWIN_PG_USER=darwin_app -e DARWIN_PG_PASSWORD=e2e_ci_pw \
            -e DARWIN_HERMES_HOST=unreachable-in-ci -e DARWIN_HERMES_PORT=3307 -e DARWIN_HERMES_DB=tradingSignals -e DARWIN_HERMES_USER=darwin_ro -e DARWIN_HERMES_PASSWORD=unused \
            -e DARWIN_BUILD_VERSION=0.1.0 -e DARWIN_BUILD_COMMIT=${{ github.sha }} -e DARWIN_BUILD_TIME=ci -e DARWIN_ENV=e2e \
            -e DARWIN_MENDEL_E2E_FIXTURE_ADAPTER=1 \
            darwin_core:e2e
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/v1/health && break
            sleep 1
          done

      - name: Install Playwright + browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E suite against the real stack (populated fixtures)
        working-directory: frontend
        env:
          DARWIN_E2E_BASE_URL: http://localhost:8000
        run: npx playwright test e2e/shell.spec.ts e2e/shell-refinement.spec.ts e2e/datasets.spec.ts e2e/runs.spec.ts e2e/degraded.spec.ts e2e/discovery.spec.ts e2e/workshop.spec.ts e2e/mendel.spec.ts

      - name: PID-004B workspace-loss proof — delete the on-disk workspace and reload the page
        # Genuine-gap-driven proof (PID-004B directive scenario 6): the
        # SAME real Workshop e2e/workshop.spec.ts's scenario-1 test just
        # mutated (its id was written to a file by that test, in the SAME
        # working directory Playwright ran in) has its on-disk authoring
        # workspace deleted directly on the running darwin_core container
        # -- via the backend's own filesystem, never a new production UI
        # control -- then a dedicated Playwright test reloads that exact
        # Workshop page and proves the canonical, DB-backed state is still
        # fully correct.
        run: |
          WSID=$(cat frontend/e2e/fixtures/.workshop_scout_flow_id.txt)
          echo "Deleting on-disk workspace for Workshop $WSID"
          docker exec darwin_e2e_core rm -rf "/srv/DARWIN/workspaces/$WSID"
          echo "DARWIN_E2E_WORKSPACE_LOSS_WORKSHOP_ID=$WSID" >> "$GITHUB_ENV"

      - name: Run workspace-loss E2E proof
        working-directory: frontend
        env:
          DARWIN_E2E_BASE_URL: http://localhost:8000
        run: npx playwright test e2e/workshop-workspace-loss.spec.ts

      - name: Tear down populated stack, stand up a fresh unseeded one for empty-state proof
        run: |
          docker rm -f darwin_e2e_core
          docker rm -f darwin_e2e_pg
          docker run -d --name darwin_e2e_pg_empty --network darwin_e2e_net \
            -e POSTGRES_DB=darwin -e POSTGRES_USER=darwin_app -e POSTGRES_PASSWORD=e2e_ci_pw \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec darwin_e2e_pg_empty pg_isready -U darwin_app -d darwin && break
            sleep 1
          done
          sed -i 's/DARWIN_PG_HOST=darwin_e2e_pg$/DARWIN_PG_HOST=darwin_e2e_pg_empty/' /tmp/darwin_e2e.env
          docker run --rm --env-file /tmp/darwin_e2e.env --network darwin_e2e_net \
            -v ${{ github.workspace }}:/work -w /work \
            python:3.12-slim bash -c "pip install -q -e . && darwin migrate"
          docker run -d --name darwin_e2e_core_empty --network darwin_e2e_net -p 8001:8000 \
            --add-host mcp-api.trader.dev:127.0.0.1 \
            -e DARWIN_PG_HOST=darwin_e2e_pg_empty -e DARWIN_PG_PORT=5432 -e DARWIN_PG_DB=darwin -e DARWIN_PG_USER=darwin_app -e DARWIN_PG_PASSWORD=e2e_ci_pw \
            -e DARWIN_HERMES_HOST=unreachable-in-ci -e DARWIN_HERMES_PORT=3307 -e DARWIN_HERMES_DB=tradingSignals -e DARWIN_HERMES_USER=darwin_ro -e DARWIN_HERMES_PASSWORD=unused \
            -e DARWIN_BUILD_VERSION=0.1.0 -e DARWIN_BUILD_COMMIT=${{ github.sha }} -e DARWIN_BUILD_TIME=ci -e DARWIN_ENV=e2e \
            darwin_core:e2e
          for i in $(seq 1 30); do
            curl -sf http://localhost:8001/api/v1/health && break
            sleep 1
          done

      - name: Run empty-state E2E proof
        working-directory: frontend
        env:
          DARWIN_E2E_BASE_URL: http://localhost:8001
        run: npx playwright test e2e/empty.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
